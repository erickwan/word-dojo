<style>
:root{
  --bg:#F4F1EC; --surface:#FFFFFF; --surface2:#EDE6DC; --ink:#26221D; --muted:#6E6459;
  --brand:#E4711E; --brand-deep:#B4530E; --brand-soft:#FBE3CE; --on-brand:#FFFFFF;
  --accent:#2F6FD0; --accent-deep:#1F4E96;
  --good:#2C9C5A; --good-bg:#E2F4E9; --bad:#DE5033; --bad-bg:#FBE9E3;
  --line:#DED3C4; --shadow:rgba(60,45,25,.10);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#191512; --surface:#241E19; --surface2:#322A22; --ink:#F3EDE5; --muted:#B0A294;
    --brand:#F08B3C; --brand-deep:#6B3308; --brand-soft:#402A18; --on-brand:#1A0E05;
    --accent:#6FA6F0; --accent-deep:#1F4E96;
    --good:#4CC97E; --good-bg:#153826; --bad:#FF8261; --bad-bg:#3D211A;
    --line:#463A2E; --shadow:rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#191512; --surface:#241E19; --surface2:#322A22; --ink:#F3EDE5; --muted:#B0A294;
  --brand:#F08B3C; --brand-deep:#6B3308; --brand-soft:#402A18; --on-brand:#1A0E05;
  --accent:#6FA6F0; --accent-deep:#1F4E96;
  --good:#4CC97E; --good-bg:#153826; --bad:#FF8261; --bad-bg:#3D211A;
  --line:#463A2E; --shadow:rgba(0,0,0,.4);
}
*{box-sizing:border-box}
body{background:var(--bg); color:var(--ink); margin:0; padding:0 16px 48px;
  font-family:"Atkinson Hyperlegible", "Trebuchet MS", Verdana, sans-serif; font-size:17px; line-height:1.5;}
h1,h2,h3,.display{font-family:Fredoka, "Comic Sans MS", "Trebuchet MS", sans-serif; font-weight:600; letter-spacing:.2px; text-wrap:balance;}
.wrap{max-width:660px; margin:0 auto;}
header.app{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:20px 0 14px;}
.logo{display:flex; align-items:center; gap:10px; font-family:Fredoka,sans-serif; font-weight:600; font-size:1.35rem;}
.logo .mark{width:38px;height:38px;border-radius:12px;background:var(--brand);color:var(--on-brand);
  display:grid;place-items:center;font-size:1.25rem; box-shadow:0 3px 0 var(--brand-deep); font-weight:600;}
.tabs{display:flex; gap:6px; background:var(--surface2); border-radius:14px; padding:5px; width:max-content; margin:0 auto 22px;}
.tabs button{border:0; background:transparent; color:var(--muted); font-family:Fredoka,sans-serif; font-weight:500;
  font-size:.95rem; padding:8px 16px; border-radius:10px; cursor:pointer;}
.tabs button.on{background:var(--surface); color:var(--ink); box-shadow:0 2px 6px var(--shadow);}
.card{background:var(--surface); border:2px solid var(--line); border-radius:18px; padding:22px; box-shadow:0 4px 0 var(--line); margin-bottom:18px;}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border-radius:14px; cursor:pointer;
  font-family:Fredoka,sans-serif; font-weight:500; font-size:1.05rem; padding:13px 22px;
  background:var(--surface); color:var(--ink); border:2px solid var(--line); box-shadow:0 3px 0 var(--line);}
.btn:active{transform:translateY(2px); box-shadow:0 1px 0 var(--line);}
.btn.primary{background:var(--brand); color:var(--on-brand); border-color:var(--brand-deep); box-shadow:0 4px 0 var(--brand-deep); font-size:1.15rem; padding:15px 26px;}
.btn.primary:active{box-shadow:0 1px 0 var(--brand-deep);}
.btn.accent{background:var(--accent); color:#231a00; border-color:var(--accent-deep); box-shadow:0 4px 0 var(--accent-deep);}
.btn:focus-visible,.tabs button:focus-visible,.opt:focus-visible,.tile:focus-visible{outline:3px solid var(--accent); outline-offset:2px;}
.btn[disabled]{opacity:.55; cursor:default;}
.big-num{font-family:Fredoka,sans-serif; font-weight:600; font-size:2.6rem; line-height:1;}
.muted{color:var(--muted);}
.center{text-align:center;}
.home-hero{padding:30px 22px;}
.tilerow{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:12px; margin-bottom:18px;}
.tile{background:var(--surface); border:2px solid var(--line); border-radius:14px; padding:14px 16px;}
.tile .v{font-family:Fredoka,sans-serif; font-weight:600; font-size:1.7rem; font-variant-numeric:tabular-nums;}
.tile .l{color:var(--muted); font-size:.85rem;}
.chip{display:inline-block; border-radius:999px; padding:2px 10px; font-size:.8rem; font-weight:700;}
.pos-noun{background:rgba(52,130,208,.16);}
.pos-verb{background:rgba(222,80,51,.16);}
.pos-adjective{background:rgba(245,168,0,.20);}
.pos-adverb{background:rgba(150,90,220,.16);}
.qword{font-family:Fredoka,sans-serif; font-weight:600; font-size:2.1rem; margin:6px 0 2px;}
.qask{color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.08em; font-size:.78rem;}
.opts{display:flex; flex-direction:column; gap:10px; margin-top:16px;}
.opt{text-align:left; font-size:1rem; line-height:1.4; padding:13px 16px; border-radius:14px; cursor:pointer;
  background:var(--surface2); color:var(--ink); border:2px solid var(--line); font-family:inherit;}
.opt:hover{border-color:var(--brand);}
.opt.right{background:var(--good-bg); border-color:var(--good);}
.opt.wrong{background:var(--bad-bg); border-color:var(--bad);}
.opt[disabled]{cursor:default;}
.sentence{font-size:1.15rem; line-height:1.7; margin:10px 0;}
.blank{display:inline-block; min-width:90px; border-bottom:3px solid var(--brand); text-align:center; font-weight:700; color:var(--brand);}
.typebox{display:flex; gap:10px; margin-top:14px;}
.typebox input{flex:1; font-family:Fredoka,sans-serif; font-size:1.2rem; padding:11px 14px; border-radius:12px;
  border:2px solid var(--line); background:var(--surface2); color:var(--ink); min-width:0;}
.typebox input:focus-visible{outline:3px solid var(--accent); outline-offset:1px;}
.tiles{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px;}
.tile-btn{width:46px;height:50px;border-radius:12px;border:2px solid var(--line);background:var(--surface2);
  font-family:Fredoka,sans-serif;font-weight:600;font-size:1.3rem;color:var(--ink);cursor:pointer;box-shadow:0 3px 0 var(--line);}
.tile-btn[disabled]{opacity:.25; box-shadow:none;}
.slots{display:flex; flex-wrap:wrap; gap:6px; margin-top:16px; min-height:52px; align-items:center;}
.slot{width:40px;height:48px;border-radius:10px;border:2px dashed var(--line);display:grid;place-items:center;
  font-family:Fredoka,sans-serif;font-weight:600;font-size:1.3rem;}
.slot.filled{border-style:solid; background:var(--brand-soft); border-color:var(--brand);}
.fb{border-radius:14px; padding:14px 16px; margin-top:16px; font-weight:700; border:2px solid;}
.fb.good{background:var(--good-bg); border-color:var(--good);}
.fb.bad{background:var(--bad-bg); border-color:var(--bad);}
.fb .note{font-weight:400; margin-top:4px;}
.progress{display:flex; align-items:center; gap:12px; margin-bottom:14px;}
.pbar{flex:1; height:10px; border-radius:999px; background:var(--surface2); overflow:hidden;}
.pbar div{height:100%; background:var(--brand); border-radius:999px; transition:width .3s;}
.streak{font-family:Fredoka,sans-serif; font-weight:600; color:var(--accent-deep);}
:root[data-theme="dark"] .streak{color:var(--accent);}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .streak{color:var(--accent);}}
.stars{font-size:2.4rem; letter-spacing:.1em; color:var(--accent);}
.stars .off{color:var(--surface2); -webkit-text-stroke:1px var(--line);}
table{border-collapse:collapse; width:100%; font-size:.92rem;}
th{color:var(--muted); text-transform:uppercase; letter-spacing:.06em; font-size:.72rem; text-align:left; padding:8px 10px; border-bottom:2px solid var(--line);}
td{padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:top; font-variant-numeric:tabular-nums;}
.tblwrap{overflow-x:auto;}
.dots{white-space:nowrap; letter-spacing:2px; font-size:.8rem;}
.dots .on{color:var(--brand);}
.dots .offd{color:var(--line);}
.acc-pill{border-radius:999px; padding:2px 9px; font-weight:700; font-size:.8rem; white-space:nowrap;}
.acc-hi{background:var(--good-bg); color:var(--good);}
.acc-mid{background:rgba(245,168,0,.2); color:var(--accent-deep);}
:root[data-theme="dark"] .acc-mid{color:var(--accent);}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .acc-mid{color:var(--accent);}}
.acc-lo{background:var(--bad-bg); color:var(--bad);}
.wordrow{display:flex; justify-content:space-between; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); align-items:baseline;}
.wordrow:last-child{border-bottom:0;}
.wordex{font-size:.88rem; color:var(--muted); font-style:italic; margin-top:3px;
  border-left:3px solid var(--line); padding-left:9px;}
textarea{width:100%; min-height:110px; border-radius:12px; border:2px solid var(--line); background:var(--surface2);
  color:var(--ink); font-family:inherit; font-size:.9rem; padding:10px;}
.savebanner{display:flex; align-items:center; justify-content:space-between; gap:12px; background:var(--accent);
  color:#231a00; border-radius:14px; padding:10px 16px; margin-bottom:16px; font-weight:700;}
.savebanner .btn{padding:8px 14px; font-size:.95rem;}
.explain{font-size:.9rem; color:var(--muted);}
ul.tricky{padding-left:0; list-style:none; margin:10px 0 0;}
ul.tricky li{padding:8px 0; border-bottom:1px solid var(--line);}
ul.tricky li:last-child{border-bottom:0;}
ul.tricky b{font-family:Fredoka,sans-serif; font-weight:600;}
/* --- list browsing toolbar (My words / Progress) --- */
.toolbar{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:12px 0 6px;}
.toolbar input.search{flex:1 1 190px; min-width:0; padding:9px 12px; border-radius:12px;
  border:2px solid var(--line); background:var(--surface2); color:var(--ink); font-family:inherit; font-size:.95rem;}
.toolbar input.search:focus-visible{outline:3px solid var(--accent); outline-offset:1px;}
.toolbar select{padding:9px 10px; border-radius:12px; border:2px solid var(--line);
  background:var(--surface2); color:var(--ink); font-family:inherit; font-size:.88rem; cursor:pointer;}
.chips{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:6px;}
.chipbtn{border:2px solid var(--line); background:var(--surface); color:var(--muted); border-radius:999px;
  padding:5px 12px; font-size:.85rem; font-weight:700; cursor:pointer; font-family:inherit;}
.chipbtn:hover{border-color:var(--brand);}
.chipbtn.on{background:var(--brand); color:var(--on-brand); border-color:var(--brand-deep);}
.chipbtn .n{opacity:.7; font-weight:400; margin-left:4px;}
.resultcount{color:var(--muted); font-size:.85rem; margin:2px 0 6px;}
.emptylist{color:var(--muted); text-align:center; padding:26px 10px;}
.showmore{display:block; margin:14px auto 0;}
.tblwrap.tall{max-height:60vh; overflow-y:auto;}
.tblwrap td:not(:first-child), .tblwrap th:not(:first-child){white-space:nowrap;}
.tblwrap td:first-child{min-width:150px;}
@media (max-width:560px){
  .tblwrap td:first-child{min-width:0;}
  .wordtbl .dots{letter-spacing:0; font-size:.7rem;}
  .wordtbl th, .wordtbl td{padding:8px 6px;}
  .wordtbl td:nth-child(4), .wordtbl th:nth-child(4),
  .wordtbl td:nth-child(5), .wordtbl th:nth-child(5){display:none;}
}
.tblwrap.tall thead th{position:sticky; top:0; background:var(--surface); z-index:1;}
.grouphdr{display:flex; align-items:baseline; gap:8px; margin:16px 0 2px; padding-top:10px; border-top:2px solid var(--line);}
.grouphdr:first-of-type{border-top:0; padding-top:0; margin-top:4px;}
.grouphdr h3{margin:0; font-size:1rem;}
.grouphdr .n{color:var(--muted); font-size:.85rem;}
/* --- power-up end-of-round scene --- */
.pw-scene{position:relative; display:flex; justify-content:center; margin:2px 0; min-height:210px; overflow:hidden; border-radius:14px;}
.pw-fighter{width:170px; height:auto; position:relative; z-index:2;}
.clip-wrap{position:relative; z-index:2;}
.clip-wrap picture{display:block;}
.clip-img{height:auto; display:block; border-radius:14px;}
.pw-gif{max-height:200px; width:auto; max-width:86%; margin:0 auto;}
.dragon-gif{width:100%; max-width:320px; margin:0 auto;}
.pw-scene canvas{position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:1;}
@keyframes pw-brace{
  0%{transform:translateY(0) scaleY(1);}
  20%{transform:translateY(5px) scaleY(.95);}
  55%{transform:translateY(-4px) scaleY(1.03);}
  100%{transform:translateY(0) scaleY(1);}
}
@keyframes pw-shake{
  0%,100%{transform:translateX(0);} 20%{transform:translateX(-3px);}
  40%{transform:translateX(3px);} 60%{transform:translateX(-2px);} 80%{transform:translateX(2px);}
}
@keyframes pw-flash{ 0%{opacity:0;} 12%{opacity:.85;} 100%{opacity:0;} }
@keyframes pw-pop{ from{opacity:0; transform:scale(.7) translateY(10px);} to{opacity:1; transform:none;} }
.pw-fighter{animation:pw-brace 1.1s cubic-bezier(.3,1.2,.5,1) both;}
.pw-ssj .pw-scene{animation:pw-shake .5s ease-in-out .35s 3;}
.pw-flash{position:absolute; inset:0; background:radial-gradient(circle at 50% 62%, #fff6c9 0%, #ffd23f 35%, transparent 70%);
  z-index:3; pointer-events:none; animation:pw-flash 1.1s ease-out .3s both;}
.ki-earned{display:inline-flex; align-items:center; gap:6px; font-family:Fredoka,sans-serif; font-weight:600;
  color:#0b6f8c; background:rgba(62,139,255,.14); border-radius:999px; padding:4px 14px; margin-top:2px;
  animation:pw-pop .5s ease-out .7s both;}
:root[data-theme="dark"] .ki-earned{color:#8fd4ff;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ki-earned{color:#8fd4ff;}}
/* --- dragon ball hunt --- */
.db-row{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin:12px 0 4px;}
.db-slot{width:46px; height:46px; border-radius:50%;}
.db-slot.empty{border:2px dashed var(--line); background:var(--surface2); opacity:.55;}
@keyframes db-appear{ from{opacity:0; transform:scale(.4) rotate(-40deg);} to{opacity:1; transform:none;} }
.db-slot.filled{animation:db-appear .45s cubic-bezier(.3,1.5,.5,1) both;}
@keyframes db-glow{ 0%,100%{filter:drop-shadow(0 0 2px rgba(255,170,40,.6));} 50%{filter:drop-shadow(0 0 9px rgba(255,170,40,.95));} }
.db-ready .db-slot.filled{animation:db-appear .45s cubic-bezier(.3,1.5,.5,1) both, db-glow 1.6s ease-in-out .5s infinite;}
.dragon-stage{position:relative; min-height:210px; display:flex; align-items:center; justify-content:center;}
@keyframes dg-rise{ from{opacity:0; transform:translateY(40px) scale(.9);} to{opacity:1; transform:none;} }
.dragon-stage svg{animation:dg-rise 1s cubic-bezier(.2,1,.4,1) both;}
@media (prefers-reduced-motion: reduce){
  .pw-fighter,.pw-ssj .pw-scene,.pw-flash,.db-slot.filled,.db-ready .db-slot.filled,.dragon-stage svg{animation:none;}
  .pw-flash{display:none;}
}
/* --- 14-day levels chart --- */
/* Sequential orange, stepped per theme against that theme's surface (not flipped):
   on light, further progress = darker; on dark, further progress = brighter. */
:root{ --lv0:#FCE0C6; --lv1:#E4711E; --lv2:#75340A; }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --lv0:#6B3209; --lv1:#EE8A3E; --lv2:#FBDFC5; }
}
:root[data-theme="dark"]{ --lv0:#6B3209; --lv1:#EE8A3E; --lv2:#FBDFC5; }
.lv-legend{display:flex; flex-wrap:wrap; gap:14px; margin:10px 0 4px; font-size:.86rem;}
.lv-key{display:inline-flex; align-items:center; gap:6px; color:var(--ink);}
.lv-key i{width:12px; height:12px; border-radius:3px; display:inline-block; flex:0 0 auto;}
.lv-key b{font-weight:700;}
.lv-chart{position:relative; margin-top:2px;}
.lv-chart svg{width:100%; height:auto; display:block; overflow:visible;}
.lv-hit{cursor:crosshair;}
.lv-tip{position:absolute; pointer-events:none; background:var(--surface); color:var(--ink);
  border:2px solid var(--line); border-radius:10px; padding:7px 10px; font-size:.82rem;
  box-shadow:0 4px 14px var(--shadow); white-space:nowrap; transform:translate(-50%,-100%); z-index:3;}
.lv-tip .r{display:flex; align-items:center; gap:6px; margin-top:2px;}
.lv-tip i{width:9px;height:9px;border-radius:2px;display:inline-block;}
.lv-tip .d{font-weight:700;}
@media (prefers-reduced-motion: reduce){ .lv-cross{transition:none;} }
#confetti{position:fixed; inset:0; pointer-events:none;}
@media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important;} }
@media (max-width:480px){
  .card{padding:16px;}
  .qword{font-size:1.7rem;}
  body{font-size:16px;}
}
</style>

<script>
(function(){
"use strict";
var SHEET_ID = '190c37nH4QqdHu7QLtROKx7KDNq_FQhCkDU6jOFRKs54';
var SHEET_GID = '1376137610';

// Cloud score sync (Supabase). Set to null to fall back to on-device storage only.

function saveLocal(){

/* ---------- daily level snapshot ----------
   Only each word's current level is stored, so a trend has to be recorded as it
   happens; it cannot be reconstructed later. One entry per day, rewritten as the
   day goes on, kept for two months. */
var LEVEL_HISTORY_DAYS = 60;
function dayKey(t){
  var d = new Date(t);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function levelCounts(){
  var needs = 0, learning = 0, mastered = 0;
  // render() runs before the sheet sync fills the word list in
  (state.items || []).forEach(function(it){
    var t = st0(it.id);
    if (t.seen === 0) return;              // not practised yet, so not on the chart
    if (t.box >= 4) mastered++;
    else if (t.box === 3) learning++;
    else needs++;
  });
  return [needs, learning, mastered];
}
function snapshotLevels(){
  if (!state.levelHistory) state.levelHistory = {};
  state.levelHistory[dayKey(Date.now())] = levelCounts();
  var keys = Object.keys(state.levelHistory).sort();
  while (keys.length > LEVEL_HISTORY_DAYS) delete state.levelHistory[keys.shift()];
}

/* ---------- cloud sync (Supabase REST; active only when REMOTE is set) ---------- */
function remoteHeaders(){

async function remoteLoad(){

  if (!r.ok) throw new Error('remote load failed');

}
async function remoteSave(){
  var h = remoteHeaders();
  h.Prefer = 'resolution=merge-duplicates';
  var r = await fetch(REMOTE.url + '/rest/v1/word_lab', {
    method: 'POST', headers: h,
    body: JSON.stringify({ id: REMOTE.row, state: state, updated_at: new Date().toISOString() })
  });
  if (!r.ok) throw new Error('remote save failed');
}
function mergeRemote(remote){
  if (!remote) return false;
  var changed = false;
  var haveSession = {};
  state.sessions.forEach(function(s){ haveSession[s.t] = 1; });
  (remote.sessions || []).forEach(function(s){
    if (!haveSession[s.t]){ state.sessions.push(s); changed = true; }
  });
  state.sessions.sort(function(a, b){ return a.t - b.t; });
  Object.keys(remote.stats || {}).forEach(function(id){
    var rs = remote.stats[id], ls = state.stats[id];
    if (!ls || rs.last > ls.last){ state.stats[id] = rs; changed = true; }
  });
  if (typeof remote.ki === 'number' && remote.ki > (state.ki || 0)){ state.ki = remote.ki; changed = true; }
  if (typeof remote.wishes === 'number' && remote.wishes > (state.wishes || 0)){ state.wishes = remote.wishes; changed = true; }
  // Union the day snapshots; a day recorded on another device is still true here.
  Object.keys(remote.levelHistory || {}).forEach(function(k){
    if (!state.levelHistory[k]){ state.levelHistory[k] = remote.levelHistory[k]; changed = true; }
  });
  var haveItem = {};
  state.items.forEach(function(it){ haveItem[it.id] = 1; });
  (remote.items || []).forEach(function(it){
    if (!haveItem[it.id]){ state.items.push(it); changed = true; }
  });
  return changed;
}
async function persist(){
  saveLocal();
  if (!REMOTE) return { ok:true, local:true };
  try { await remoteSave(); dirty = false; return { ok:true }; }
  catch (e) { return { ok:false }; }
}

/* ---------- word sync from the Google Sheet ---------- */
var lastSync = null;
function normWord(w){
  var fixes = { frabricate:'fabricate', apease:'appease' };
  w = String(w).toLowerCase().trim();
  return fixes[w] || w;
}
function normPos(word, pos){
  if (word === 'asunder') return 'adverb';
  pos = String(pos || '').toLowerCase().trim();
  if (pos.indexOf('adverb') === 0) return 'adverb';
  if (pos.indexOf('adjective') === 0) return 'adjective';
  if (pos.indexOf('verb') === 0) return 'verb';
  if (pos.indexOf('noun') === 0) return 'noun';
  return pos || 'noun';
}
function parseSheetDate(s){
  var m = String(s).match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
  if (!m) return todayIso();
  var y = m[3].length === 2 ? '20' + m[3] : m[3];
  return y + '-' + m[1].padStart(2, '0') + '-' + m[2].padStart(2, '0');
}
function todayIso(){
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
async function syncSheet(){
  try {
    var r = await fetch('https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?tqx=out:json&gid=' + SHEET_GID);
    if (!r.ok) throw new Error('sheet fetch failed');
    var t = await r.text();
    var json = JSON.parse(t.substring(t.indexOf('{'), t.lastIndexOf('}') + 1));
    // columns: Word | Part of speech | Meaning | Synonym | Antonym | Example sentence
    var rows = json.table.rows.map(function(row){
      return (row.c || []).slice(0, 6).map(function(c){
        return c ? String(c.f != null ? c.f : c.v).trim() : '';
      });
    });
    var counts = {}, added = 0, needMeaning = 0;
    var existing = {};
    state.items.forEach(function(it){ existing[it.id] = 1; });
    rows.forEach(function(row){
      var raw = row[0] || '';
      if (!raw || raw.toLowerCase() === 'word') return;
      // A row with no meaning yet cannot be practised; count it so the parent
      // view can say how many are still waiting to be filled in.
      if (!row[2]){ needMeaning++; return; }
      var word = normWord(raw);
      counts[word] = (counts[word] || 0) + 1;
      var id = word.replace(/[^a-z]/g, '') + '-' + counts[word];
      if (existing[id]) return;
      state.items.push({
        id: id, word: word, pos: normPos(word, row[1]),
        meaning: row[2], syn: row[3] || '', ant: row[4] || '',
        example: row[5] || '', added: todayIso()
      });
      existing[id] = 1; added++;
    });
    lastSync = { ok:true, added:added, needMeaning:needMeaning, t:Date.now() };
    if (added){ saveLocal(); if (!session) render(); }
    else if (view === 'parent') render();
  } catch (e) {
    lastSync = { ok:false, t:Date.now() };
    if (view === 'parent') render();
  }
}

/* ---------- stats helpers ---------- */
var EMPTY_STAT = { box:1, due:0, last:0, seen:0, correct:0, wrong:0 };
function st0(id){ return state.stats[id] || EMPTY_STAT; }
function st(id){
  if (!state.stats[id]) state.stats[id] = { box:1, due:0, last:0, seen:0, correct:0, wrong:0 };
  return state.stats[id];
}
function acc(s){ var n = s.correct + s.wrong; return n ? s.correct / n : null; }
function dueNow(id){ return st(id).due <= Date.now(); }
/* Only words Jax has actually met can be "due". The rest are not overdue, they
   simply have not been introduced yet, and arrive five a day. */
function dueCounts(){
  var now = Date.now(), today = 0, tomorrow = 0;
  var endTomorrow = startOfDay(now) + 2*DAY;
  state.items.forEach(function(it){
    var t = st0(it.id);
    if (t.seen === 0) return;
    if (t.due <= now) today++;
    else if (t.due < endTomorrow) tomorrow++;
  });
  return { today:today, tomorrow:tomorrow };
}
function startOfDay(t){ var d = new Date(t); d.setHours(0,0,0,0); return d.getTime(); }

/* ---------- small utils ---------- */
function shuffle(a){ a = a.slice(); for (var i=a.length-1; i>0; i--){ var j = Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function lev(a, b){
  var m = a.length, n = b.length, i, j;
  if (!m) return n; if (!n) return m;
  var prev = [], cur = [];
  for (j=0; j<=n; j++) prev[j] = j;
  for (i=1; i<=m; i++){
    cur[0] = i;
    for (j=1; j<=n; j++){
      cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1] + (a.charAt(i-1) === b.charAt(j-1) ? 0 : 1));
    }
    var t = prev; prev = cur; cur = t;
  }
  return prev[n];
}
function letterDiff(a, b){
  var c = {}, k, d = 0;
  for (k=0; k<a.length; k++) c[a[k]] = (c[a[k]]||0) + 1;
  for (k=0; k<b.length; k++) c[b[k]] = (c[b[k]]||0) - 1;
  for (k in c) d += Math.abs(c[k]);
  return d;
}
function relTime(t){
  if (!t) return '—';
  var d = startOfDay(Date.now()) - startOfDay(t);
  if (d <= 0) return 'today';
  var days = Math.round(d / DAY);
  if (days === 1) return 'yesterday';
  if (days < 30) return days + 'd ago';
  return new Date(t).toLocaleDateString();
}
function dueLabel(t){
  var now = Date.now();
  if (t <= now) return 'now';
  var d = startOfDay(t) - startOfDay(now);
  var days = Math.round(d / DAY);
  if (days <= 0) return 'today';
  if (days === 1) return 'tomorrow';
  return 'in ' + days + 'd';
}

/* ---------- word matching (tolerant of small spelling slips) ---------- */
function tokenMatches(tok, word){
  var clean = tok.toLowerCase().replace(/[^a-z]/g, '');
  if (!clean) return false;
  var w = word.toLowerCase();
  if (clean === w) return true;
  var sufs = ['s','es','ed','d','ing','ly','ness'];
  for (var i=0; i<sufs.length; i++){
    var s = sufs[i];
    if (clean === w + s) return true;
    if (clean.length > s.length && clean.slice(-s.length) === s){
      var stem = clean.slice(0, -s.length);
      if (lev(stem, w) <= 2 && letterDiff(stem, w) <= 2 && stem[0] === w[0]) return true;
    }
  }
  if (clean.length >= 5 && clean[0] === w[0] && lev(clean, w) <= 2) return true;
  return false;
}
function findBlank(item){
  var source = exampleFor(item);
  if (!source) return null;
  var toks = source.split(/(\s+)/);
  for (var i=0; i<toks.length; i++){
    if (tokenMatches(toks[i], item.word)){
      var before = toks.slice(0, i).join('');
      var after = toks.slice(i+1).join('');
      var punct = toks[i].match(/[^A-Za-z]*$/)[0];
      return { before: before, after: punct + after };
    }
  }
  return null;
}
function checkTyped(input, word){
  var a = input.trim().toLowerCase().replace(/[^a-z]/g,'');
  var b = word.toLowerCase();
  if (!a) return { ok:false };
  if (a === b) return { ok:true, exact:true };
  var tol = b.length >= 8 ? 2 : 1;
  if (a.length >= 3 && lev(a, b) <= tol) return { ok:true, exact:false };
  return { ok:false };
}

/* ---------- question generation ---------- */
function enrichOf(item){ return (window.ENRICH || {})[item.id] || null; }
function makeQuestion(item, entry){
  // Freshly generated question for this word, when one came back. A repeat of a
  // missed word falls through to the local generator so it isn't the same twice.
  if (session && session.gen && session.gen[item.id] && !(entry && (entry.retry || entry.encore))){
    var g = session.gen[item.id];
    QCACHE.consume(item.id);   // asked now, so the next review gets a new one
    QASKS.note(item.id, g.type, g.prompt, g.options, g.answer);
    return { item:item, type:g.type, prompt:g.prompt, options: shuffle(g.options.slice()),
             answer:g.answer, teach:g.teach, why:g.why || {}, generated:true };
  }
  return makeLocalQuestion(item);
}
function makeLocalQuestion(item){
  var types = ['meaning', 'wordpick'];
  var blank = findBlank(item);
  if (blank) types.push('blank');
  if (item.word.length <= 12 && item.word.indexOf(' ') < 0) types.push('scramble');
  var en = enrichOf(item);
  if (en){
    (en.quiz || []).forEach(function(t){ types.push(t.type, t.type); });   // authored usage questions, double weight
  }
  // Skip the angle this word was last asked from, so a fallback run does not
  // hand back the question the student just had.
  var lastType = QASKS.lastType(item.id);
  var fresh = types.filter(function(t){ return t !== lastType; });
  var type = pick(fresh.length ? fresh : types);
  var q = { item:item, type:type };
  if (type === 'syn' || type === 'ant' || type === 'cloze' || type === 'scen'){
    var authored = en.quiz.filter(function(t){ return t.type === type; })[0];
    q.prompt = authored.prompt || '';
    q.options = shuffle(authored.options.slice());
    q.answer = authored.answer;
    QASKS.note(item.id, q.type, q.prompt, q.options, q.answer);
    return q;
  }

  if (type === 'meaning'){
    var pool = state.items.filter(function(o){ return o.word !== item.word; });
    var same = pool.filter(function(o){ return o.pos === item.pos; });
    var src = same.length >= 3 ? same : pool;
    var opts = [], used = {};
    shuffle(src).forEach(function(o){
      if (opts.length < 3 && !used[o.meaning] && o.meaning !== item.meaning){ used[o.meaning] = 1; opts.push(o.meaning); }
    });
    q.options = shuffle(opts.concat([item.meaning]));
    q.answer = item.meaning;
  } else if (type === 'wordpick'){
    var pool2 = state.items.filter(function(o){ return o.word !== item.word; });
    var same2 = pool2.filter(function(o){ return o.pos === item.pos; });
    var src2 = same2.length >= 3 ? same2 : pool2;
    var opts2 = [], used2 = {};
    shuffle(src2).forEach(function(o){
      if (opts2.length < 3 && !used2[o.word]){ used2[o.word] = 1; opts2.push(o.word); }
    });
    q.options = shuffle(opts2.concat([item.word]));
    q.answer = item.word;
  } else if (type === 'blank'){
    q.blank = blank;
    q.answer = item.word;
  } else {
    var w = item.word.toLowerCase();
    var letters = shuffle(w.split(''));
    var guard = 0;
    while (letters.join('') === w && guard++ < 10) letters = shuffle(w.split(''));
    q.letters = letters;
    q.answer = w;
  }
  QASKS.note(item.id, q.type, q.prompt || (q.blank ? q.blank.before + '___' + q.blank.after : ''),
             q.options, q.answer);
  return q;
}

/* ---------- session ---------- */
var session = null;
/* Jax meets a few brand-new words a day (NEW_PER_DAY). The allowance is per calendar day
   rather than per round, so a second round on the same day is pure review and
   he is never shown more than five unfamiliar words in a day. */
function todayKey(){
  var d = new Date();
  return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
}
function newWordsLeftToday(){
  if (state.newDay !== todayKey()) return NEW_PER_DAY;
  return Math.max(0, NEW_PER_DAY - (state.newCount || 0));
}
function noteNewWordsShown(n){
  if (!n) return;
  if (state.newDay !== todayKey()){ state.newDay = todayKey(); state.newCount = 0; }
  state.newCount = (state.newCount || 0) + n;
}

function buildQueue(){
  var now = Date.now();
  var seenItems = state.items.filter(function(it){ return st0(it.id).seen > 0; });
  var due = seenItems.filter(function(it){ return st0(it.id).due <= now; });
  due.sort(function(a, b){
    var sa = st0(a.id), sb = st0(b.id);
    return (sa.box - sb.box) || (sa.due - sb.due) || (a.added < b.added ? -1 : 1);
  });
  var q = due.slice(0, SESSION_SIZE);

  // introduce today's remaining new words, in sheet order
  var newbies = [];
  var allowance = Math.min(newWordsLeftToday(), Math.max(0, SESSION_SIZE - q.length));
  if (allowance > 0){
    newbies = state.items.filter(function(it){ return st0(it.id).seen === 0; }).slice(0, allowance);
  }

  // still short? top up with whatever is closest to being due
  if (q.length + newbies.length < SESSION_SIZE){
    var chosen = {};
    q.concat(newbies).forEach(function(it){ chosen[it.id] = 1; });
    var rest = seenItems.filter(function(it){ return !chosen[it.id]; })
      .sort(function(a, b){ return st0(a.id).due - st0(b.id).due; });
    q = q.concat(rest.slice(0, SESSION_SIZE - q.length - newbies.length));
  }

  // every new word gets a teaching card before it is ever asked about
  var entries = shuffle(q).map(function(it){ return { item: it, mode:'quiz', retry:false }; });
  newbies.forEach(function(it, i){
    entries.splice(Math.min(i * 2, entries.length), 0, { item: it, mode:'learn' });
  });
  newbies.forEach(function(it){ entries.push({ item: it, mode:'quiz', retry:false }); });

  // Early on there is little to review, which would leave a short round. Give
  // the round's words extra passes instead: the question type varies each time,
  // so a repeat is a different angle on the word rather than a rerun. New words
  // come first in the rotation; capped at three extra passes each, so a day
  // with only one word does not become that word ten times over.
  var scored = q.length + newbies.length;
  var pool = newbies.concat(q);
  if (scored < SESSION_SIZE && pool.length){
    var extra = Math.min(SESSION_SIZE - scored, pool.length * 3);
    for (var k = 0; k < extra; k++){
      entries.push({ item: pool[k % pool.length], mode:'quiz', retry:false, encore:true });
      scored++;
    }
  }
  return { entries: entries, total: scored, newCount: newbies.length };
}

/* A round is prepared (queue built + questions requested) before Jax presses
   Start, so generation latency is hidden. */
var prepared = null;
var awaitingRound = null;

function prepareRound(){
  var built = buildQueue();
  if (!built.total) return null;
  var round = { built: built, questions: {}, state:'pending', why:null };
  var words = [], seenId = {};
  built.entries.forEach(function(e){
    if (e.mode !== 'quiz' || seenId[e.item.id]) return;
    seenId[e.item.id] = 1;
    words.push({ item: e.item, history: st0(e.item.id), recent: QASKS.recent(e.item.id) });
  });
  round.promise = QGEN.generateCached(QCACHE, GEN_CFG, words, PROFILE).then(function(r){
    round.questions = r.questions || {};
    round.state = r.ok ? 'ready' : 'failed';
    round.why = r.why;
    return round;
  });
  return round;
}
function prefetchRound(){
  if (prepared || session) return;
  prepared = prepareRound();
}
function startSession(){
  var round = prepared || prepareRound();
  prepared = null;
  if (!round) return;
  if (round.state === 'pending'){
    awaitingRound = round;
    render();
    round.promise.then(function(){
      if (awaitingRound === round){ awaitingRound = null; launchRound(round); }
    });
    return;
  }
  launchRound(round);
}
function launchRound(round){
  session = {
    queue: round.built.entries,
    idx: 0, total: round.built.total, firstTry: {}, streak: 0, bestStreak: 0,
    types: {}, missed: {}, scored: [], done: false,
    gen: round.questions || {}, genState: round.state
  };
  saveLocal();
  nextQuestion();
}
function nextQuestion(){
  if (session.idx >= session.queue.length){ endSession(); return; }
  var entry = session.queue[session.idx];
  if (entry.mode === 'learn'){ session.q = null; session.answered = false; render(); return; }
  session.q = makeQuestion(entry.item, entry);
  session.answered = false;
  session.chosen = -1;
  render();
}
function answer(correct, detail){
  if (session.answered) return;
  session.answered = true;
  var entry = session.queue[session.idx];
  var item = entry.item;
  var s = st(item.id);
  if (!entry.retry){
    session.firstTry[item.id] = correct;
    session.scored.push(correct);
    var tk = session.q.type;
    if (!session.types[tk]) session.types[tk] = [0, 0];
    session.types[tk][1]++;
    if (correct) session.types[tk][0]++;
    /* The daily new-word allowance is spent here, on the word's first-ever
       answer, not when the round launches — a round quit partway must not
       burn slots for words Jax never reached. */
    if (!s.seen) noteNewWordsShown(1);
    s.seen++; s.last = Date.now();
    if (correct){
      s.correct++;
      s.box = Math.min(5, s.box + 1);
      s.due = startOfDay(Date.now()) + INTERVALS[s.box - 1] * DAY + 8*3600000;
      if (s.due <= Date.now()) s.due = Date.now() + DAY;
    } else {
      s.wrong++;
      s.box = 1;
      s.due = Date.now();
      session.missed[item.id] = 1;
      session.queue.push({ item:item, mode:'quiz', retry:true });
    }
    saveLocal();
  }
  if (correct){ session.streak++; session.bestStreak = Math.max(session.bestStreak, session.streak); }
  else session.streak = 0;
  session.feedback = { correct: correct, detail: detail || '' };
  render();
}
function endSession(){
  var correct = session.scored.filter(Boolean).length;
  state.sessions.push({
    t: Date.now(), correct: correct, total: session.total,
    types: session.types, missed: Object.keys(session.missed)
  });
  saveLocal();
  session.done = true;
  session.score = { correct: correct, total: session.total };
  session.earned = correct;
  session.clip = pickClip(session.total ? correct / session.total : 0);
  state.ki = (state.ki || 0) + correct;
  saveLocal();
  render();
  setTimeout(function(){ if (!prepared) prepared = prepareRound(); }, 1500);
  if (REMOTE) persist().then(function(r){
    var n = document.getElementById('save-note');
    if (n) n.textContent = r.ok ? 'Score synced.' : 'Couldn’t sync right now — the score is saved on this device and will sync later.';
  });
  if (session.total && correct / session.total >= 0.9) confetti();
}

/* Giphy serves several renditions per clip. Most are fine at full size, but a
   long or high-framerate one can be tens of megabytes, so a clip may name a
   lighter file. The scene renders about 200px tall, so 200w loses nothing. */
function clipUrl(clip, ext){
  var file = ext === 'webp' ? (clip.webp || 'giphy.webp') : (clip.gif || 'giphy.gif');
  return 'https://media.giphy.com/media/' + clip.id + '/' + file;
}

function pickClip(pct){
  var pool = PW_CLIPS.filter(function(c){ return pct >= 0.7 || !c.winOnly; });
  var lastId = null;
  try { lastId = localStorage.getItem(LAST_CLIP_KEY); } catch (e) {}
  var fresh = pool.filter(function(c){ return c.id !== lastId; });
  if (fresh.length) pool = fresh;                       // never the same clip twice running
  var clip = pool[Math.floor(Math.random() * pool.length)];
  try { localStorage.setItem(LAST_CLIP_KEY, clip.id); } catch (e) {}
  return clip;
}

// picture + hidden fallback; watchClips() swaps them if the clip fails to load
function clipMarkup(clip, imgClass, fallbackHtml){
  return '<div class="clip-wrap">' +
    '<picture>' +
      '<source srcset="' + clipUrl(clip, 'webp') + '" type="image/webp">' +
      '<img class="clip-img ' + imgClass + '" src="' + clipUrl(clip, 'gif') + '" ' +
        'alt="' + clip.alt + '" decoding="async">' +
    '</picture>' +
    '<div class="clip-fallback" style="display:none;">' + fallbackHtml + '</div>' +

}

function watchClips(){
  var imgs = document.querySelectorAll('.clip-img');
  for (var k = 0; k < imgs.length; k++){
    (function(img){
      if (img.dataset.watched) return;
      img.dataset.watched = '1';
      function fail(){
        var wrap = img.closest('.clip-wrap');
        if (!wrap) return;
        var pic = wrap.querySelector('picture');
        var fb = wrap.querySelector('.clip-fallback');
        if (pic) pic.style.display = 'none';
        if (fb) fb.style.display = 'block';
      }
      img.addEventListener('error', fail);
      if (img.complete && img.naturalWidth === 0) fail();
    })(imgs[k]);
  }
}

/* Rising ki motes and lifted debris. Density scales with the score. */
function auraBurst(host, tier, correct, total){
  if (!host) return;
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var c = TIER_COLOR[tier];
  var cv = document.createElement('canvas');
  host.insertBefore(cv, host.firstChild);
  var rect = host.getBoundingClientRect();
  var W = cv.width = Math.max(1, Math.round(rect.width));
  var H = cv.height = Math.max(1, Math.round(rect.height));
  var ctx = cv.getContext('2d');
  var strength = total ? correct / total : 0;

  var motes = [], pebbles = [];
  var moteCount = 14 + Math.round(strength * 46);
  for (var i = 0; i < moteCount; i++){
    motes.push({ x: W/2 + (Math.random()-0.5) * W * 0.42, y: H * (0.55 + Math.random()*0.5),
                 vy: 1.1 + Math.random() * (1.4 + strength * 2.4), r: 1.6 + Math.random()*2.6,
                 life: 1, drift: (Math.random()-0.5) * 0.5 });
  }
  for (var j = 0; j < 6 + Math.round(strength * 8); j++){
    pebbles.push({ x: W/2 + (Math.random()-0.5) * W * 0.6, y: H * (0.86 + Math.random()*0.1),
                   vy: 0.5 + Math.random() * (0.7 + strength), s: 2.5 + Math.random()*3.5,
                   a: Math.random()*Math.PI, spin:(Math.random()-0.5)*0.16, life: 1 });
  }
  var frames = 0;
  (function tick(){
    ctx.clearRect(0, 0, W, H);
    motes.forEach(function(m){
      m.y -= m.vy; m.x += m.drift; m.life -= 0.010;
      if (m.life <= 0){ m.y = H * (0.8 + Math.random()*0.2); m.x = W/2 + (Math.random()-0.5)*W*0.42; m.life = 1; }
      ctx.globalAlpha = Math.max(0, m.life) * 0.85;
      ctx.fillStyle = c.aura;
      ctx.beginPath(); ctx.ellipse(m.x, m.y, m.r, m.r * 2.1, 0, 0, Math.PI*2); ctx.fill();
    });
    pebbles.forEach(function(p){
      p.y -= p.vy; p.a += p.spin; p.life -= 0.006;
      if (p.life <= 0){ p.y = H * 0.92; p.life = 1; }
      ctx.globalAlpha = Math.max(0, p.life) * 0.7;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a);
      ctx.fillStyle = '#8a8f98';
      ctx.fillRect(-p.s/2, -p.s/2, p.s, p.s * 0.8);
      ctx.restore();
    });
    ctx.globalAlpha = 1;
    if (++frames < 200) requestAnimationFrame(tick);
    else cv.remove();
  })();
}

/* ---------- confetti ---------- */
function confetti(){
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var cv = document.createElement('canvas');
  cv.id = 'confetti';
  cv.width = innerWidth; cv.height = innerHeight;
  document.body.appendChild(cv);
  var ctx = cv.getContext('2d');
  var colors = ['#F5A800', '#0E7C7B', '#DE5033', '#2C9C5A', '#3482D0'];
  var ps = [];
  for (var i=0; i<90; i++) ps.push({
    x: cv.width/2 + (Math.random()-0.5)*200, y: cv.height*0.35,
    vx: (Math.random()-0.5)*9, vy: -Math.random()*9 - 3,
    s: 5 + Math.random()*6, c: pick(colors), r: Math.random()*Math.PI
  });
  var frames = 0;
  (function tick(){
    ctx.clearRect(0, 0, cv.width, cv.height);
    ps.forEach(function(p){
      p.x += p.vx; p.y += p.vy; p.vy += 0.25; p.r += 0.1;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.fillStyle = p.c; ctx.fillRect(-p.s/2, -p.s/2, p.s, p.s); ctx.restore();
    });
    if (++frames < 110) requestAnimationFrame(tick);
    else cv.remove();
  })();
}


/* ---------- list browsing (search / filter / sort) ---------- */
var browse = {
  words:  { q:'', f:'all', sort:'az',   limit:30 },
  parent: { q:'', f:'all', sort:'weak', limit:30 }
};
var PAGE = 30;

// One entry per headword, merging multiple senses.
function wordEntries(){
  var groups = {}, order = [];
  state.items.forEach(function(it){
    if (!groups[it.word]){ groups[it.word] = []; order.push(it.word); }
    groups[it.word].push(it);
  });
  return order.map(function(w){
    var its = groups[w];
    var box = 1, seen = 0, correct = 0, wrong = 0, last = 0, due = Infinity, added = '';
    its.forEach(function(i){
      var t = st0(i.id);
      if (t.box > box) box = t.box;
      seen += t.seen; correct += t.correct; wrong += t.wrong;
      if (t.last > last) last = t.last;
      if (t.due < due) due = t.due;
      if (i.added > added) added = i.added;
    });
    var n = correct + wrong;
    return { word:w, items:its, box:box, seen:seen, acc: n ? correct/n : null,
             last:last, due: due === Infinity ? 0 : due, added:added,
             group: seen === 0 ? 'new' : (box >= 4 ? 'mastered' : 'learning') };
  });
}

function matchesQuery(e, q){
  if (!q) return true;
  q = q.toLowerCase();
  if (e.word.toLowerCase().indexOf(q) >= 0) return true;
  return e.items.some(function(i){ return i.meaning.toLowerCase().indexOf(q) >= 0; });
}

function applyBrowse(entries, b, groupOf){
  var found = entries.filter(function(e){ return matchesQuery(e, b.q); });
  var counts = { all: found.length, new:0, learning:0, mastered:0, needs:0 };
  found.forEach(function(e){
    if (counts[e.group] !== undefined) counts[e.group]++;
    if (e.seen > 0 && (e.box <= 2 || (e.acc !== null && e.acc < 0.6))) counts.needs++;
  });
  var list = found.filter(function(e){
    if (b.f === 'all') return true;
    if (b.f === 'needs') return e.seen > 0 && (e.box <= 2 || (e.acc !== null && e.acc < 0.6));
    return e.group === b.f;
  });
  var by = {
    az:   function(a,c){ return a.word < c.word ? -1 : a.word > c.word ? 1 : 0; },
    weak: function(a,c){ return (a.box - c.box) || ((a.acc===null?1.01:a.acc) - (c.acc===null?1.01:c.acc)) || (a.word < c.word ? -1 : 1); },
    acc:  function(a,c){ return (a.acc===null?1.01:a.acc) - (c.acc===null?1.01:c.acc) || (a.word < c.word ? -1 : 1); },
    recent: function(a,c){ return (c.added > a.added ? 1 : c.added < a.added ? -1 : 0) || (a.word < c.word ? -1 : 1); },
    last: function(a,c){ return (c.last - a.last) || (a.word < c.word ? -1 : 1); },
    due:  function(a,c){ return (a.due - c.due) || (a.word < c.word ? -1 : 1); }
  };
  list = list.slice().sort(by[b.sort] || by.az);
  return { list:list, counts:counts, total:found.length };
}

function chipsHtml(key, b, counts, defs){
  return '<div class="chips">' + defs.map(function(d){
    var n = counts[d[0]];
    return '<button class="chipbtn' + (b.f === d[0] ? ' on' : '') + '" data-bf="' + key + ':' + d[0] + '">' +
      d[1] + '<span class="n">' + n + '</span></button>';
  }).join('') + '</div>';
}

function toolbarHtml(key, b, sorts, placeholder){
  return '<div class="toolbar">' +
    '<input class="search" type="search" id="q-' + key + '" data-bq="' + key + '" placeholder="' + placeholder + '" value="' + esc(b.q) + '">' +
    '<select data-bs="' + key + '" aria-label="Sort">' +
      sorts.map(function(o){
        return '<option value="' + o[0] + '"' + (b.sort === o[0] ? ' selected' : '') + '>' + o[1] + '</option>';
      }).join('') +
    '</select></div>';
}

function showMoreHtml(key, shown, total){
  if (shown >= total) return '';
  return '<button class="btn small showmore" data-bm="' + key + '">Show ' +
    Math.min(PAGE, total - shown) + ' more (' + (total - shown) + ' left)</button>';
}

/* After a wrong multiple-choice answer, say why the option he actually picked
   was wrong — not just why the right one was right. */
function wrongPickNote(q){
  if (!q.why || session.chosen == null || session.chosen < 0) return '';
  var picked = q.options[session.chosen];
  var why = picked && q.why[picked];
  if (!why) return '';
  return '<div class="note">You picked <b>' + esc(picked) + '</b> &mdash; ' + esc(why) + '</div>';
}

  function optBtn(o, i, extraStyle){
    var cls = 'opt', dis = '';

      '<div class="opts">' + q.options.map(function(o, i){ return optBtn(o, i); }).join('') + '</div>';

  } else if (q.type === 'cloze'){

      '<div class="opts">' + q.options.map(function(o, i){ return optBtn(o, i, 'font-family:Fredoka,sans-serif;font-size:1.05rem;'); }).join('') + '</div>';

/* ---------- 14-day progress chart ----------
   Sequential orange ramp: the further a word has climbed, the stronger the
   colour. Steps are chosen per theme against that theme's surface rather than
   flipped, and validated for adjacent separation (normal-vision dE ~24). */
var LEVEL_BANDS = [
  { key:'needs',    label:'Needs work', hint:'levels 1-2' },
  { key:'learning', label:'Learning',   hint:'level 3' },
  { key:'mastered', label:'Mastered',   hint:'levels 4-5' }
];
var showLevelTable = false;

/* Boxes only move when she answers, so a day with no practice genuinely holds
   the previous day's distribution. Carry forward, but never before the first
   real snapshot - that would invent history. */
function levelSeries(days){
  var hist = state.levelHistory || {};
  var keys = Object.keys(hist).sort();
  if (!keys.length) return [];
  var out = [], carry = null, today = new Date();
  for (var i = days - 1; i >= 0; i--){
    var d = new Date(today.getFullYear(), today.getMonth(), today.getDate() - i);
    var k = dayKey(d.getTime());
    if (hist[k]) carry = hist[k];
    else if (carry === null && keys[0] < k){
      var prior = keys.filter(function(x){ return x < k; });
      if (prior.length) carry = hist[prior[prior.length - 1]];
    }
    out.push({ key:k, date:d, counts: carry ? carry.slice() : null });
  }
  return out;
}


/* Crosshair + tooltip. Re-bound on each render because the view is re-rendered
   wholesale rather than patched. */
function wireLevelChart(){
  var host = document.querySelector('.lv-chart');
  if (!host || host.dataset.wired) return;
  host.dataset.wired = '1';
  var svg = host.querySelector('svg'), tip = host.querySelector('.lv-tip');
  var cross = host.querySelector('.lv-cross');
  function hide(){ tip.hidden = true; if (cross) cross.setAttribute('opacity','0'); }
  host.addEventListener('mouseleave', hide);
  host.addEventListener('mousemove', function(e){
    var t = e.target;
    if (!t || !t.classList || !t.classList.contains('lv-hit')) return;
    var parts = (t.dataset.tip || '').split('|');
    var box = host.getBoundingClientRect();
    var scale = box.width / svg.viewBox.baseVal.width;
    var cx = parseFloat(t.dataset.cx) * scale;
    if (cross){
      cross.setAttribute('x1', t.dataset.cx); cross.setAttribute('x2', t.dataset.cx);
      cross.setAttribute('opacity', '.35');
    }
    var rows = LEVEL_BANDS.map(function(b, i){
      return '<div class="r"><i style="background:var(--lv' + i + ')"></i>' + b.label +
             ' <b>' + (parts[i+1] === undefined ? '-' : parts[i+1]) + '</b></div>';
    }).join('');
    tip.innerHTML = '<div class="d">' + parts[0] + '</div>' + rows;
    tip.hidden = false;
    tip.style.left = Math.min(Math.max(cx, 60), box.width - 60) + 'px';
    tip.style.top = (box.height - 34) + 'px';
  });
}

function progressChart(){
  var days = levelSeries(14);
  var recorded = days.filter(function(d){ return d.counts; });
  var distinct = Object.keys(state.levelHistory || {}).length;

  if (!recorded.length){
    return '<div class="card"><h3 style="margin:0 0 4px;">Levels over the last 14 days</h3>' +
      '<p class="explain" style="margin:0;">Nothing recorded yet. A snapshot is taken each day Jax practises, and the chart appears once there is something to plot.</p></div>';
  }

  var W = 660, H = 210, padL = 34, padR = 12, padT = 12, padB = 26;
  var plotW = W - padL - padR, plotH = H - padT - padB;
  var maxTotal = Math.max(1, ...recorded.map(function(d){ return d.counts[0] + d.counts[1] + d.counts[2]; }));
  var yMax = Math.max(4, Math.ceil(maxTotal * 1.15));
  var x = function(i){ return padL + (days.length === 1 ? plotW/2 : (plotW * i) / (days.length - 1)); };
  var y = function(v){ return padT + plotH - (plotH * v) / yMax; };

  // stack from the bottom: needs work, then learning, then mastered
  var bandPaths = '';
  for (var b = 0; b < 3; b++){
    var upper = [], lower = [];
    days.forEach(function(d, i){
      if (!d.counts) return;
      var below = 0; for (var q = 0; q < b; q++) below += d.counts[q];
      upper.push([x(i), y(below + d.counts[b])]);
      lower.push([x(i), y(below)]);
    });
    if (upper.length < 1) continue;
    var dPath = 'M' + upper.map(function(p){ return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join('L') +
      'L' + lower.reverse().map(function(p){ return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join('L') + 'Z';
    bandPaths += '<path d="' + dPath + '" fill="var(--lv' + b + ')" stroke="var(--surface)" stroke-width="2" stroke-linejoin="round"/>';
  }

  // recessive gridlines + y labels
  var grid = '', ticks = 4;
  for (var g = 0; g <= ticks; g++){
    var v = Math.round((yMax / ticks) * g), gy = y(v);
    grid += '<line x1="' + padL + '" x2="' + (W - padR) + '" y1="' + gy.toFixed(1) + '" y2="' + gy.toFixed(1) +
      '" stroke="var(--line)" stroke-width="1" opacity=".55"/>' +
      '<text x="' + (padL - 7) + '" y="' + (gy + 3.5).toFixed(1) + '" text-anchor="end" font-size="10" fill="var(--muted)">' + v + '</text>';
  }
  // date labels at the ends and the middle only, so they never collide
  var dateLbl = '';
  [0, Math.floor((days.length-1)/2), days.length-1].forEach(function(i){
    var d = days[i].date;
    var t = d.toLocaleDateString(undefined, { month:'short', day:'numeric' });
    dateLbl += '<text x="' + x(i).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="' +
      (i === 0 ? 'start' : i === days.length-1 ? 'end' : 'middle') + '" font-size="10" fill="var(--muted)">' + t + '</text>';
  });

  // one hover column per day: crosshair + tooltip
  var hits = days.map(function(d, i){
    var w = plotW / Math.max(1, days.length - 1);
    var cx = x(i);
    var tip = d.counts
      ? d.date.toLocaleDateString(undefined,{month:'short',day:'numeric'}) + '|' +
        d.counts[0] + '|' + d.counts[1] + '|' + d.counts[2]
      : d.date.toLocaleDateString(undefined,{month:'short',day:'numeric'}) + '|-|-|-';
    return '<rect class="lv-hit" x="' + (cx - w/2).toFixed(1) + '" y="' + padT + '" width="' + w.toFixed(1) +
      '" height="' + plotH + '" fill="transparent" data-tip="' + tip + '" data-cx="' + cx.toFixed(1) + '"></rect>';
  }).join('');

  var now = levelCounts();
  var legend = '<div class="lv-legend">' + LEVEL_BANDS.map(function(bnd, i){
    return '<span class="lv-key"><i style="background:var(--lv' + i + ')"></i>' + bnd.label +
      ' <b>' + now[i] + '</b> <span class="muted">' + bnd.hint + '</span></span>';
  }).join('') + '</div>';

  var table = '';
  if (showLevelTable){
    table = '<div class="tblwrap" style="margin-top:10px;"><table><thead><tr><th>Day</th>' +
      LEVEL_BANDS.map(function(b){ return '<th>' + b.label + '</th>'; }).join('') + '<th>Total</th></tr></thead><tbody>' +
      days.slice().reverse().map(function(d){
        if (!d.counts) return '<tr><td>' + d.date.toLocaleDateString(undefined,{month:'short',day:'numeric'}) +
          '</td><td colspan="4" class="muted">not recorded</td></tr>';
        var tot = d.counts[0]+d.counts[1]+d.counts[2];
        return '<tr><td>' + d.date.toLocaleDateString(undefined,{month:'short',day:'numeric'}) + '</td>' +
          d.counts.map(function(c){ return '<td>' + c + '</td>'; }).join('') + '<td>' + tot + '</td></tr>';
      }).join('') + '</tbody></table></div>';
  }

  var note = distinct < 2
    ? '<p class="explain" style="margin:6px 0 0;">Only today is recorded so far &mdash; the line fills in as he practises on more days.</p>'
    : '';

  return '<div class="card">' +
    '<div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;">' +
      '<h3 style="margin:0;">Levels over the last 14 days</h3>' +
      '<button class="btn small" data-act="lv-table">' + (showLevelTable ? 'Hide numbers' : 'Show numbers') + '</button>' +
    '</div>' +
    legend +
    '<div class="lv-chart"><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" ' +
      'aria-label="Stacked area chart of how many words sit at each level over the last 14 days">' +
      grid + bandPaths + dateLbl + hits +
      '<line class="lv-cross" x1="0" x2="0" y1="' + padT + '" y2="' + (padT + plotH) + '" stroke="var(--ink)" stroke-width="1" opacity="0"/>' +
    '</svg><div class="lv-tip" hidden></div></div>' +
    note + table + '</div>';
}



function parentView(){
  var d = dueCounts();
  var rows = state.items.map(function(it){
    var s = st(it.id);
    return { it:it, s:s, a:acc(s) };
  });
  var struggling = rows.filter(function(r){ return r.s.seen >= 2 && (r.a !== null && r.a < 0.6); });
  var mastered = rows.filter(function(r){ return r.s.box >= 4; });
  var sorted = rows.slice().sort(function(x, y){
    var ax = x.a === null ? 1.01 : x.a, ay = y.a === null ? 1.01 : y.a;
    return (x.s.box - y.s.box) || (ax - ay) || (x.it.word < y.it.word ? -1 : 1);
  });
  function accPill(a){
    if (a === null) return '<span class="muted">—</span>';
    var p = Math.round(a * 100);
    var cls = p >= 80 ? 'acc-hi' : p >= 60 ? 'acc-mid' : 'acc-lo';
    return '<span class="acc-pill ' + cls + '">' + p + '%</span>';
  }
  var focus = sorted.filter(function(r){ return r.s.seen > 0 && (r.a === null || r.a < 0.8 || r.s.box <= 2); }).slice(0, 5);
  var typeNames = { meaning:'Pick the meaning', wordpick:'Pick the word', blank:'Fill in the sentence', scramble:'Unscramble',
    syn:'Synonyms', ant:'Antonyms', cloze:'New-sentence fit', scen:'Real-life usage',
    analogy:'Analogies', oddone:'Odd one out' };
  var typeAgg = {};
  state.sessions.forEach(function(ss){
    Object.keys(ss.types || {}).forEach(function(k){
      if (!typeAgg[k]) typeAgg[k] = [0, 0];
      typeAgg[k][0] += ss.types[k][0]; typeAgg[k][1] += ss.types[k][1];
    });
  });
  var typeHtml = Object.keys(typeAgg).length ?
    '<div class="card"><h3 style="margin:0 0 10px;">Accuracy by question type</h3>' +
    Object.keys(typeAgg).map(function(k){
      var t = typeAgg[k]; var p = t[1] ? Math.round(100 * t[0] / t[1]) : 0;
      return '<div style="display:flex;align-items:center;gap:10px;margin:7px 0;">' +
        '<span style="width:170px;font-size:.88rem;">' + (typeNames[k] || k) + '</span>' +
        '<div class="pbar" style="flex:1;"><div style="width:' + p + '%"></div></div>' +
        '<span style="width:88px;text-align:right;font-variant-numeric:tabular-nums;font-size:.88rem;">' + p + '% <span class="muted">(' + t[1] + ')</span></span></div>';
    }).join('') + '</div>' : '';

  var sessionsHtml = state.sessions.length ?
    '<div class="card"><h3 style="margin:0 0 8px;">Practice history</h3>' +
    state.sessions.slice().reverse().slice(0, 15).map(function(ss){
      var p = ss.total ? Math.round(100 * ss.correct / ss.total) : 0;
      return '<div class="wordrow"><span>' + new Date(ss.t).toLocaleDateString(undefined, { month:'short', day:'numeric' }) +
        ' <span class="muted">' + new Date(ss.t).toLocaleTimeString(undefined, { hour:'numeric', minute:'2-digit' }) + '</span></span>' +
        '<span>' + ss.correct + '/' + ss.total + ' ' + accPill(ss.total ? ss.correct / ss.total : null) + '</span></div>';
    }).join('') + '</div>' : '<div class="card explain">No practice rounds yet — the history will appear here.</div>';

  return saveBanner() +
    '<div class="tilerow">' +
    '<div class="tile"><div class="v">' + state.items.length + '</div><div class="l">words (all senses)</div></div>' +
    '<div class="tile"><div class="v">' + d.today + '</div><div class="l">due now</div></div>' +
    '<div class="tile"><div class="v">' + mastered.length + '</div><div class="l">mastered (level 4+)</div></div>' +
    '<div class="tile"><div class="v">' + struggling.length + '</div><div class="l">struggling (&lt;60%)</div></div>' +
    '</div>' +
    progressChart() +
    (focus.length ? '<div class="card"><h3 style="margin:0 0 4px;">Needs the most practice</h3><ul class="tricky">' +
      focus.map(function(r){
        return '<li><b>' + esc(r.it.word) + '</b> ' + accPill(r.a) + ' <span class="muted">level ' + r.s.box + ' &middot; ' + esc(r.it.meaning) + '</span></li>';
      }).join('') + '</ul></div>' : '') +
    typeHtml +
    parentWordsCard() +
    sessionsHtml +
    '<div class="card"><h3 style="margin:0 0 6px;">New words</h3>' +
    '<p class="explain">Words load from the <a href="' + SHEET_URL + '" target="_blank" rel="noopener" style="color:var(--brand);">Google Sheet</a> every time the page opens — add rows there and they show up here automatically. Jax meets ' + NEW_PER_DAY + ' new words a day.</p>' +
    (lastSync && lastSync.needMeaning
      ? '<p class="explain"><b>' + lastSync.needMeaning + ' rows in the sheet have no meaning yet</b>, so they are skipped. Fill in the Meaning column and they join the rotation.</p>' : '') +
    '<div style="margin-top:6px;display:flex;gap:10px;align-items:center;">' +
    '<button class="btn accent" data-act="sync">Check for new words</button>' +
    '<span class="explain" id="sync-note">' + syncNote() + '</span></div></div>' +
    '<p class="explain">How it works: every word starts at level 1. Each right answer moves it up a level and it rests longer (1, 3, 7, then 14 days). A miss sends it back to level 1 so it shows up again right away. ' +
    (REMOTE ? 'Scores sync to the cloud, so any device with this link shows the same progress.'
            : 'Scores are stored on this device — practice and check progress on the same device, or ask about cloud sync.') + '</p>';
}

function buildingView(){
  return '<div class="card home-hero center">' +
    '<div class="qask">Getting ready</div>' +
    '<h1 style="margin:6px 0 10px; font-size:1.6rem;">Making your questions&hellip;</h1>' +
    '<div class="pbar" style="max-width:260px;margin:0 auto 14px;"><div style="width:60%"></div></div>' +
    '<p class="explain" style="margin:0 0 18px;">Fresh questions are being written for today&rsquo;s words.</p>' +
    '<button class="btn" data-act="skip-gen">Start without waiting</button>' +
    '</div>';
}

function render(){
  var html = header();
  if (view === 'home'){
    if (summoning) html += summonView();
    else if (awaitingRound) html += buildingView();
    else if (session && !session.done)
      html += (session.queue[session.idx] && session.queue[session.idx].mode === 'learn')
        ? learnView() : quizView();
    else if (session && session.done) html += endView();
    else html += homeView();
  } else if (view === 'words') html += wordsView();
  else html += parentView();
  root.innerHTML = html;
  if (session && !session.done && session.q && session.q.type === 'scramble' && !session.answered) renderScramble();
  watchClips();
  wireLevelChart();

  var inp = document.getElementById('typed');
  if (inp && !session.answered){
    inp.focus();
    inp.addEventListener('keydown', function(e){ if (e.key === 'Enter') submitTyped(); });
  }
}

/* scramble state */
var scr = { picked: [] };
function renderScramble(){
  var q = session.q;
  if (!scr.q || scr.q !== q){ scr = { q:q, picked: [] }; }
  var slots = document.getElementById('slots'), tiles = document.getElementById('tiles');
  if (!slots) return;
  var word = q.answer;
  slots.innerHTML = '';
  for (var i=0; i<word.length; i++){
    var d = document.createElement('div');
    d.className = 'slot' + (i < scr.picked.length ? ' filled' : '');
    d.textContent = i < scr.picked.length ? q.letters[scr.picked[i]] : '';
    slots.appendChild(d);
  }
  tiles.innerHTML = '';
  q.letters.forEach(function(ch, i){
    var b = document.createElement('button');
    b.className = 'tile-btn';
    b.textContent = ch;
    b.disabled = scr.picked.indexOf(i) >= 0;
    b.addEventListener('click', function(){
      if (session.answered) return;
      scr.picked.push(i);
      if (scr.picked.length === word.length){
        var built = scr.picked.map(function(j){ return q.letters[j]; }).join('');
        var ok = built === word;
        renderScramble();
        setTimeout(function(){ answer(ok, ok ? '' : 'You built “' + esc(built) + '”'); }, 250);
      } else renderScramble();
    });
    tiles.appendChild(b);
  });
}

function submitTyped(){
  if (session.answered) return;
  var inp = document.getElementById('typed');
  if (!inp || !inp.value.trim()) return;
  var res = checkTyped(inp.value, session.q.answer);
  if (res.ok && !res.exact) answer(true, 'So close on spelling — it’s written “' + esc(session.q.answer) + '”');
  else if (res.ok) answer(true, '');
  else answer(false, 'You wrote “' + esc(inp.value.trim()) + '”');
}

function syncNote(){
  if (!lastSync) return 'Checking the sheet…';
  if (!lastSync.ok) return 'Couldn’t reach the sheet — using the words already here.';
  return lastSync.added ? 'Added ' + lastSync.added + ' new ' + (lastSync.added === 1 ? 'entry' : 'entries') + '!' : 'Everything is up to date.';
}

/* Browsing controls update only their own list block, so typing in the search
   box never re-renders (and never blurs) the input itself. */
function refreshBrowse(key){
  var el = document.getElementById('dyn-' + key);
  if (!el) return;
  el.innerHTML = key === 'words' ? wordsDyn() : parentWordsDyn();
}
root.addEventListener('input', function(e){
  var key = e.target && e.target.dataset && e.target.dataset.bq;
  if (!key || !browse[key]) return;
  browse[key].q = e.target.value;
  browse[key].limit = PAGE;
  refreshBrowse(key);
});
root.addEventListener('change', function(e){
  var key = e.target && e.target.dataset && e.target.dataset.bs;
  if (!key || !browse[key]) return;
  browse[key].sort = e.target.value;
  browse[key].limit = PAGE;
  refreshBrowse(key);
});
root.addEventListener('click', function(e){
  var t = e.target.closest('button');
  if (!t) return;
  if (t.dataset.view){
    if (session && !session.done && !confirm('Leave this practice round?')) return;
    if (session && !session.done) session = null;
    view = t.dataset.view; render(); return;
  }
  if (t.dataset.bf){
    var pf = t.dataset.bf.split(':');
    if (browse[pf[0]]){ browse[pf[0]].f = pf[1]; browse[pf[0]].limit = PAGE; refreshBrowse(pf[0]); }
    return;
  }
  if (t.dataset.bm){
    if (browse[t.dataset.bm]){ browse[t.dataset.bm].limit += PAGE; refreshBrowse(t.dataset.bm); }
    return;
  }
  var act = t.dataset.act;
  if (act === 'summon'){ summoning = true; render(); confetti(); return; }
  if (act === 'wish-done'){
    summoning = false;
    state.ki = Math.max(0, (state.ki || 0) - KI_PER_BALL * BALLS);
    state.wishes = (state.wishes || 0) + 1;
    saveLocal();
    if (REMOTE) persist();
    render();
    return;
  }
  if (act === 'start'){ startSession(); return; }
  if (act === 'skip-gen'){
    var pend = awaitingRound; awaitingRound = null;
    if (pend){ pend.state = 'skipped'; pend.questions = {}; launchRound(pend); }
    return;
  }
  if (act === 'quit'){ if (confirm('Quit this round? Answered words still count.')) { session = null; render(); } return; }
  if (act === 'next'){ session.idx++; session.feedback = null; nextQuestion(); return; }
  if (act === 'submit-typed'){ submitTyped(); return; }
  if (act === 'scr-undo'){ if (!session.answered && scr.picked.length){ scr.picked.pop(); renderScramble(); } return; }
  if (act === 'finish'){ session = null; render(); return; }
  if (act === 'lv-table'){ showLevelTable = !showLevelTable; render(); return; }
  if (act === 'save-now'){
    t.disabled = true; t.textContent = 'Syncing…';
    persist().then(function(r){
      if (r.ok) render();
      else { t.disabled = false; t.textContent = 'Try again'; }
    });
    return;
  }
  if (act === 'sync'){
    t.disabled = true;
    var note = document.getElementById('sync-note');
    if (note) note.textContent = 'Checking the sheet…';
    lastSync = null;
    syncSheet().then(function(){
      t.disabled = false;
      var n = document.getElementById('sync-note');
      if (n) n.textContent = syncNote();
    });
    return;
  }
  if (t.dataset.opt !== undefined && session && !session.answered){
    var q = session.q;
    session.chosen = Number(t.dataset.opt);
    answer(q.options[session.chosen] === q.answer, '');
  }
});

render();
// Prefetch only after the sheet sync and cloud merge settle, so the round is
// built from the current word list and the up-to-date review schedule.
var ready = [syncSheet()];
if (REMOTE){
  ready.push(remoteLoad().then(function(remote){
    var changed = mergeRemote(remote);
    scrub(state);
    if (changed){ saveLocal(); if (!session) render(); }
    if (dirty) return persist().then(function(){ if (!session) render(); });
  }).catch(function(){}));
}
Promise.all(ready).then(prefetchRound, prefetchRound);
})();
</script>
